name: amazify
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase (keep these new)
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2

  # Social auth
  flutter_facebook_auth: ^7.1.2 # <-- upgrade to support http 1.x
  google_sign_in: ^6.2.1 # <-- upgrade iOS pod to modern GoogleSignIn

  # Networking
  http: ^1.5.0

  # State & UI (unchanged)
  provider: ^6.1.5+1
  flutter_animate: ^4.0.0
  font_awesome_flutter: ^10.2.0
  animate_do: ^4.2.0
  audioplayers: ^6.5.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.5.0
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  flutter_datetime_picker: ^1.5.1
  flutter_secure_storage: ^9.2.4
  flutter_slider_drawer: ^3.0.2
  ftoast: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  iconsax: ^0.0.8
  intl: ^0.20.2
  liquid_glass_renderer: ^0.1.1-dev.10
  logger: ^2.6.1
  lottie: ^3.3.0
  panara_dialogs: ^0.1.5
  rive: ^0.13.20
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  carousel_slider: ^5.1.1
  google_fonts:
  dartz: ^0.10.1
  get_it: ^8.2.0
  supabase_flutter: ^2.10.0
  fpdart: ^1.1.1
  internet_connection_checker_plus: ^2.7.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  image_picker_for_web: ^3.1.0
  image_picker_macos: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_icon3_dark.png
    - assets/icons/app_icon3.png
    - assets/audio/Netflix-Intro-Sound-Effect.mp3
    - assets/audio/splashy.mp3
    - assets/samples/animations/
    - assets/samples/ui/rive_app/
    - assets/samples/ui/rive_app/rive/
    - assets/samples/ui/rive_app/images/
    - assets/samples/ui/rive_app/images/backgrounds/
    - assets/samples/ui/rive_app/images/topics/
    - assets/samples/ui/rive_app/images/avatars/
    - assets/lottie/
    - assets/Images/
    - assets/products/

  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/Golos_Text/GolosText-VariableFont_wght.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icons/app_icon3.png"
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icons/app_icon3.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon3.png"
  linux:
    generate: true
    image_path: "assets/icons/app_icon3.png"
